name: pr-description

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  describe:
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'ai-describe')

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanity check files
        run: |
          set -euxo pipefail
          test -f .github/models/pr-desc/prompt.md
          test -f .github/models/pr-desc/build_context.js
          node -v
          git --version

      - name: Build context
        run: |
          set -euo pipefail
          node .github/models/pr-desc/build_context.js \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" > pr_context.json
          echo "CONTEXT_BYTES=$(wc -c < pr_context.json)"

      - name: Compose prompt file (template + context)
        run: |
          : > combined_prompt.txt
          echo "[PROMPT TEMPLATE]" >> combined_prompt.txt
          cat .github/models/pr-desc/prompt.md >> combined_prompt.txt
          echo -e "\n---\n[CONTEXT JSON]\n" >> combined_prompt.txt
          cat pr_context.json >> combined_prompt.txt
          echo "COMBINED_PROMPT_BYTES=$(wc -c < combined_prompt.txt)"

      - name: Generate PR description (EN, friendly tone, with title)
        id: ai_full
        uses: actions/ai-inference@v1
        with:
          model: gpt-4o-mini
          max-tokens: 1000
          temperature: 0.2
          top_p: 0.9
          system: |
            You are a senior maintainer writing a Pull Request description for other engineers.
            Respond in **English only**, using a friendly and helpful tone.
            Start with a one-line H1 title summarizing this PR in ~6–12 words.
            Then follow EXACTLY the sections in [OUTPUT FORMAT]:
            "### 🎯 What & Why"
            "### 💡 Key Changes"
            "### 🔎 Pointers for Reviewer"
            Do not add other sections.
          prompt-file: combined_prompt.txt

      - name: Compose final comment body
        shell: bash
        run: |
          set -euo pipefail
          : > pr_comment.md
          # 모델 응답을 안전하게 파일에 기록 (이중 인용부호 사용)
          printf "%s\n" "${{ steps.ai_full.outputs.response }}" >> pr_comment.md

          echo "COMMENT_BYTES=$(wc -c < pr_comment.md)"
          head -c 200 pr_comment.md || true; echo

      - name: Post as PR comment (never edit PR body)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ github.event.pull_request.number }}"
          gh pr comment "$NUM" --body-file pr_comment.md

      # GitHub has historically rewritten comment bodies in rare cases
      # (encoding, escaping, sanitization, etc.).  Capture the posted
      # comment and compare it against the generated file so we can fail
      # fast with a useful error when that happens.
      - name: Capture posted comment body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ github.event.pull_request.number }}"
          gh api "repos/${{ github.repository }}/issues/$NUM/comments" \
            --jq '.[-1].body' > posted_comment.md

      - name: Verify posted comment matches generated body
        run: |
          set -euo pipefail
          if ! diff -u pr_comment.md posted_comment.md; then
            echo "----- pr_comment.md (expected) -----"
            cat pr_comment.md
            echo
            echo "----- posted_comment.md (actual) -----"
            cat posted_comment.md
            echo
            echo "::error::PR comment posted by gh CLI differs from generated body"
            exit 1
          fi
